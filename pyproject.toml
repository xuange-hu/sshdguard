[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sshdguard"
version = "0.1.0"
description = "Zero-dependency sshd_config security auditor — three-pass scanning (line, keyword combination, Match scope and cross-Include), first-obtained-value-wins duplicate detection, weak algorithm tables, evidence-first with line numbers and byte offsets, SARIF for CI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "xuange-hu" }]
# Dependency-free on purpose: sshd lives on the least provisioned boxes in the
# estate, and the audit has to run there (air-gapped, minimal images, rescue shells).
dependencies = []
keywords = [
  "security",
  "ssh",
  "sshd",
  "sshd-config",
  "hardening",
  "audit",
  "static-analysis",
  "sarif",
  "devsecops",
  "linter",
  "openssh",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and moved the import path; this server
# targets the 1.x line only.
mcp = ["mcp>=1.2,<3"]

[project.urls]
Homepage = "https://github.com/xuange-hu/sshdguard"
Repository = "https://github.com/xuange-hu/sshdguard"
Issues = "https://github.com/xuange-hu/sshdguard/issues"

[project.scripts]
sshdguard = "sshdguard.cli:main"
sshdguard-mcp = "sshdguard.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sshdguard = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Rule prose is documentation: splitting a sentence at column 120 makes the
# generated rule table harder to read without changing any behaviour.
"src/sshdguard/rules.py" = ["E501"]
# sys.path is injected above the import so a bare clone can run the tests.
"tests/test_mcp_server.py" = ["E402"]
